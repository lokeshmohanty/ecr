[workspace]
resolver = "2"
members = [
    "crates/ecr-core",
    "crates/ecr-store",
    "crates/ecr-server",
    "crates/ecr-cli",
    "shell",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR GPL-3.0-or-later"
authors = ["Lokesh Mohanty <lokeshmohanty@users.noreply.github.com>"]
repository = "https://github.com/lokeshmohanty/ecr"
homepage = "https://github.com/lokeshmohanty/ecr"
rust-version = "1.88"
keywords = ["email", "notmuch", "maildir", "mail"]
categories = ["email", "command-line-utilities"]

[workspace.dependencies]
ecr-core = { path = "crates/ecr-core", version = "0.2.0" }
ecr-store = { path = "crates/ecr-store", version = "0.2.0" }
ecr-server = { path = "crates/ecr-server", version = "0.2.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2
