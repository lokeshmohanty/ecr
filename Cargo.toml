[package]
name = "ecr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ecr"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
toml = "1.1.1"
dirs = "6.0.0"
egui_extras = { version = "0.34.1", features = ["image", "all_loaders"] }
image = { version = "0.25.10", features = ["png", "jpeg", "gif"] }
html2text = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
opt-level = 2
