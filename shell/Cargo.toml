[package]
name = "ecr-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Not the workspace's 1.88: the notification plugin pulls notify-rust, which
# needs 1.89. That is the desktop shell's problem alone — it is `publish =
# false` and is built from the toolchain the flake pins, while the four crates
# that go to crates.io still build on 1.88 and say so.
rust-version = "1.89"
description = "Desktop and Android shell for the ecr web client"
publish = false

[lib]
name = "ecr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ecr-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The `deep-link` feature is what makes a `mailto:` reach an app that is already
# running. On Linux and Windows a deep link is argv of a *new* process, so
# without single-instance the desktop opens a second ecr and the first one never
# hears about it.
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
