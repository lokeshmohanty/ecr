[graph]
all-features = true

[licenses]
# ecr is dual-licensed MIT OR GPL-3.0-or-later. The dependency tree is kept
# permissively licensed by choice — a permissive tree is easier to reason about
# and keeps the MIT distribution free of copyleft obligations from dependencies.
# The list is deliberately closed: a new licence appearing in the tree fails CI
# and forces a decision rather than a silent obligation.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # Mozilla's CA certificate set, reached through reqwest's platform verifier
  # since `ecr oauth` started speaking TLS. CDLA-Permissive-2.0 is a *data*
  # licence: it grants use and redistribution of the data with no obligation to
  # share anything back, and explicitly imposes no terms on software that uses
  # it. Allowed rather than worked around because the alternative is shipping
  # our own root store, which is a worse answer to the same question.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft. We consume these unmodified from the registry,
# which is why they are allowed above; modifying one means publishing the change
# under MPL-2.0. See THIRD-PARTY.md.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

# Every entry below is an *unmaintained* notice, not a vulnerability. They are
# listed one by one rather than silenced with `unmaintained = "allow"` on
# purpose: a genuinely new unmaintained dependency should still stop CI, and
# each of these should be revisited when the reason for it goes away.
ignore = [
  # The GTK3 bindings, ten crates of them. Tauri v2 draws its Linux window with
  # WebKitGTK, which is GTK3; there is no GTK4 path to move to, and `shell`
  # additionally uses gtk directly for `ensure_screen_resolution`. Revisit when
  # Tauri ships a GTK4 or non-GTK Linux backend.
  { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0414", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0417", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },
  { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 bindings, required by Tauri v2 on Linux" },

  # Transitive, build-time only, and reached through dependencies we do not
  # choose directly.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, a transitive build dependency" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range, transitive" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common, transitive" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property, transitive" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, transitive" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, transitive" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
