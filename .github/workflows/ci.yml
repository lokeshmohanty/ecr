name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mail tooling and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch isync msmtp \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # `just lint` and `just test` reach the whole workspace, and the desktop
      # shell embeds web/dist at compile time — so a pure-Rust job cannot build
      # this workspace at all. The recipes build the client themselves; this is
      # only what they need to do it.
      - run: pnpm --dir web install --frozen-lockfile

      - run: just fmt-check
      - run: just lint
      - run: just test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2

      # Compiles only. The declared MSRV promises the *published* crates build,
      # not that the whole test harness does — and not the desktop shell, which
      # is `publish = false`, carries its own higher rust-version, and is built
      # from the toolchain the flake pins rather than from whatever a consumer
      # happens to have.
      - run: cargo check -p ecr-core -p ecr-store -p ecr-server -p ecr-cli --all-targets

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm exec vite build

      - name: The bundled font licences shipped
        run: test -f dist/licenses/fonts/nunito-OFL-1.1.txt

  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        suite: [verify, verify-compose, verify-view, verify-marks, verify-ux, visual]
    steps:
      - uses: actions/checkout@v5

      - name: Install mail tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch isync msmtp

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --dir web exec playwright install --with-deps chromium

      - run: just ${{ matrix.suite }}

      # A visual failure is only actionable if you can see the diff.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.suite }}
          path: |
            screenshots/visual/current/
            screenshots/visual/diff/
            screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # flake.nix advertises this cache as a substituter, so it has to actually
      # hold something: the `main` channel is consumed straight from git, and
      # without a populated cache every `nix flake update` is a full rebuild of
      # the client and the server for whoever is tracking it.
      #
      # Pull requests from forks cannot see the token. The push is skipped there
      # rather than failed — a fork should not need a secret to run CI.
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: lokeshmohanty
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --print-build-logs
      # ecr-desktop as well as ecr: it is the expensive one to build, it is what
      # `programs.ecr.desktop` installs, and it is the whole WebKitGTK closure.
      - run: nix build .#ecr .#ecr-web .#ecr-desktop --print-build-logs

  android:
    name: android
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - run: cargo tauri android init --ci
        working-directory: shell
      # Lays ecr's manifest, network security config and launcher icon over the
      # generated tree, and warns if Tauri's template moved underneath it. This
      # is where that warning is meant to be seen — CI builds Android on every
      # push, so a template change surfaces here rather than at release time.
      - run: ./scripts/android-overlay.sh
      - run: cargo tauri android build --debug
        working-directory: shell

  ios:
    name: ios (build only)
    runs-on: macos-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Unsigned, and not installable on a device. This job catches bitrot in the
      # iOS target; shipping needs an Apple Developer account, a certificate and
      # a provisioning profile. See docs/content/releasing.md#ios.
      - run: cargo tauri ios init --ci
        working-directory: shell
      - run: cargo tauri ios build --debug -- -CODE_SIGNING_ALLOWED=NO
        working-directory: shell
