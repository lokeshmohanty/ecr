name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mail tooling and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch isync msmtp \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # `just lint` and `just test` reach the whole workspace, and the desktop
      # shell embeds web/dist at compile time — so a pure-Rust job cannot build
      # this workspace at all. The recipes build the client themselves; this is
      # only what they need to do it.
      - run: pnpm --dir web install --frozen-lockfile

      - run: just fmt-check
      - run: just lint
      - run: just test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2

      # Compiles only. The declared MSRV promises the *published* crates build,
      # not that the whole test harness does — and not the desktop shell, which
      # is `publish = false`, carries its own higher rust-version, and is built
      # from the toolchain the flake pins rather than from whatever a consumer
      # happens to have.
      - run: cargo check -p ecr-core -p ecr-store -p ecr-server -p ecr-cli --all-targets

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm exec vite build

      - name: The bundled font licences shipped
        run: test -f dist/licenses/fonts/nunito-OFL-1.1.txt

  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [rust, web]
    strategy:
      fail-fast: false
      matrix:
        suite: [verify, verify-compose, verify-view, verify-marks, verify-ux, visual]
    steps:
      - uses: actions/checkout@v5

      - name: Install mail tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch isync msmtp

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --dir web exec playwright install --with-deps chromium

      # Only the visual suite. The other five assert on the DOM and do not care
      # which chromium runs them; this one compares pixels, and two different
      # browser builds rasterise the same glyph differently — which is exactly
      # how it failed the first time it ever ran here. scripts/visual.sh takes
      # the browser from `nix build .#visual-browser`, pinned by the flake, so
      # this job and a laptop render the same image.
      - if: matrix.suite == 'visual'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: just ${{ matrix.suite }}
        env:
          # The visual suite refuses to compare against baselines rendered with
          # a different browser or font set, rather than reporting a difference
          # that says nothing about the UI.
          ECR_STRICT_RENDER: ${{ matrix.suite == 'visual' && '1' || '' }}

      # A visual failure is only actionable if you can see the diff.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.suite }}
          path: |
            screenshots/visual/current/
            screenshots/visual/diff/
            screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # flake.nix advertises this cache as a substituter, so it has to actually
      # hold something: the `main` channel is consumed straight from git, and
      # without a populated cache every `nix flake update` is a full rebuild of
      # the client and the server for whoever is tracking it.
      #
      # Pull requests from forks cannot see the token. The push is skipped there
      # rather than failed — a fork should not need a secret to run CI.
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: lokeshmohanty
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --print-build-logs
      # ecr-desktop as well as ecr: it is the expensive one to build, it is what
      # `programs.ecr.desktop` installs, and it is the whole WebKitGTK closure.
      - run: nix build .#ecr .#ecr-web .#ecr-desktop --print-build-logs

  android:
    name: android
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      # Explicitly, rather than relying on tauri.conf.json's
      # beforeBuildCommand: that runs `pnpm --dir web build`, which is only
      # correct from the repository root, and `cargo tauri build` is invoked
      # from shell/. Building it here makes the job independent of whichever
      # directory the hook happens to run in.
      - run: pnpm --dir web exec vite build
      - run: cargo tauri android init --ci
        working-directory: shell
      # Lays ecr's manifest, network security config and launcher icon over the
      # generated tree, and warns if Tauri's template moved underneath it. This
      # is where that warning is meant to be seen — CI builds Android on every
      # push, so a template change surfaces here rather than at release time.
      - run: ./scripts/android-overlay.sh

      # A *release* build, signed with a throwaway key generated here and never
      # leaving the runner. Two things only this catches:
      #
      # Tauri's generated gradle has no `signingConfigs` block, so until
      # `signing.gradle` existed the release workflow wrote the keystore secrets
      # into a `keystore.properties` that nothing read — it announced "APK will
      # be signed." and shipped `app-universal-release-unsigned.apk` anyway. A
      # debug build cannot notice that: it is signed by Android's own debug key
      # regardless.
      #
      # And release is the configuration that ships — minify and proguard run
      # here and nowhere else. `just android` builds debug locally every day,
      # so that path is not the one at risk.
      #
      # A throwaway key rather than the real secrets on purpose: PRs from forks
      # cannot see secrets, and this must gate them too.
      - name: Build a signed release APK with a throwaway key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" \
            -storepass ci-throwaway -keypass ci-throwaway \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=ecr ci, O=ecr, C=ZZ"
          {
            echo "storeFile=$RUNNER_TEMP/ci.jks"
            echo "storePassword=ci-throwaway"
            echo "keyAlias=ci"
            echo "password=ci-throwaway"
          } > shell/gen/android/keystore.properties
          (cd shell && cargo tauri android build --apk)

      - name: The release APK is signed
        run: |
          apk=$(find shell/gen/android -path '*/build/outputs/*' -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          echo "$apk"
          # gradle names the artifact `-unsigned` exactly when the release build
          # type has no signing config, which is the whole failure being pinned.
          case "$apk" in
            *-unsigned.apk)
              echo "::error::the release APK is unsigned — signing.gradle did not apply"
              exit 1
              ;;
          esac
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --verbose "$apk"

  # The desktop bundles, built here for the same reason Android is: nothing else
  # runs the bundler. `nix build .#ecr-desktop` compiles the binary but never
  # packages it, so every failure that lives in the deb and AppImage bundlers —
  # a desktop entry that will not render, an icon the AppDir cannot find, a
  # linuxdeploy that refuses — was invisible until a tag was already pushed.
  # Both of the first release's failures were of exactly that kind.
  #
  # Deliberately not `needs: [rust, web]`: this is the only gate on bundling and
  # it is self-contained, so making it wait on the test suites would delay the
  # one signal nothing else produces. ubuntu-22.04 to match the release job,
  # since glibc is forward-compatible but not backward.
  bundle:
    name: bundle (deb, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev patchelf file desktop-file-utils

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - run: pnpm --dir web exec vite build

      # `--verbose`, because without it the bundler captures linuxdeploy's
      # output and reports the whole failure as `failed to run linuxdeploy`,
      # which names neither the file nor the reason. See release.yml.
      - run: cargo tauri build --verbose
        working-directory: shell

