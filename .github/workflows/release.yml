name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag does not skip verification. If this fails, nothing is published.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mail tooling and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y notmuch isync msmtp \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Before the Rust gates, not after: they reach the whole workspace, and
      # the desktop shell embeds web/dist at compile time.
      - run: pnpm --dir web install --frozen-lockfile
      - run: just fmt-check
      - run: just lint
      - run: just test
      - run: just test-web

      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

  # The server and CLI, plus the built web client it serves.
  tarball:
    name: tarball (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec vite build
      - run: cargo build --release -p ecr-cli --target ${{ matrix.target }}

      # `share/ecr/web` beside the binary is one of the locations
      # ecr_server::web::locate already searches, so this layout needs no flag.
      - name: Assemble
        run: |
          stage="ecr-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/ecr"
          mkdir -p "$stage/bin" "$stage/share/ecr"
          cp "$bin" "$stage/bin/"
          cp -r web/dist "$stage/share/ecr/web"
          cp README.md CHANGELOG.md LICENSE THIRD-PARTY.md "$stage/"
          cp -r licenses "$stage/licenses"

          # Nothing starts the server on a machine that is not running NixOS,
          # and a tarball has no post-install hook to do it. Shipping the unit
          # beside the binary is the difference between `systemctl --user
          # enable --now ecr` and writing one by hand.
          mkdir -p "$stage/share/systemd/user"
          cp packaging/ecr.service "$stage/share/systemd/user/"

          # Generated by the binary being shipped rather than checked in, so
          # they cannot describe a different command tree. Both runners are
          # native, so it can simply be run.
          mkdir -p "$stage/share/man/man1" \
                   "$stage/share/bash-completion/completions" \
                   "$stage/share/zsh/site-functions" \
                   "$stage/share/fish/vendor_completions.d"
          "$bin" man > "$stage/share/man/man1/ecr.1"
          "$bin" completions bash > "$stage/share/bash-completion/completions/ecr"
          "$bin" completions zsh  > "$stage/share/zsh/site-functions/_ecr"
          "$bin" completions fish > "$stage/share/fish/vendor_completions.d/ecr.fish"

          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: ecr-*.tar.gz

  # The desktop client. Built on the oldest supported runner because glibc is
  # forward-compatible but not backward.
  desktop:
    name: desktop (deb, AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev patchelf file desktop-file-utils

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      # Explicitly, rather than relying on tauri.conf.json's
      # beforeBuildCommand: that runs `pnpm --dir web build`, which is only
      # correct from the repository root, and `cargo tauri build` is invoked
      # from shell/. Building it here makes the job independent of whichever
      # directory the hook happens to run in.
      - run: pnpm --dir web exec vite build
      # `--verbose`, because at the default log level the bundler captures
      # linuxdeploy's stdout and stderr and reduces the whole failure to
      # `failed to run linuxdeploy`, naming neither the file nor the reason.
      # ci.yml's `bundle` job is what stops a break reaching a tag; this is what
      # makes one readable if it does.
      - run: cargo tauri build --verbose
        working-directory: shell

      - name: Collect bundles
        run: |
          mkdir -p out
          find target/release/bundle \
            \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: out/*

  android:
    name: android
    needs: verify
    runs-on: ubuntu-latest
    # Lifted to the job so the signing step's `if` can test it: the `secrets`
    # context is not available in a step-level condition, but `env` is.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      - run: pnpm --dir web install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Explicitly, rather than relying on tauri.conf.json's
      # beforeBuildCommand: that runs `pnpm --dir web build`, which is only
      # correct from the repository root, and `cargo tauri build` is invoked
      # from shell/. Building it here makes the job independent of whichever
      # directory the hook happens to run in.
      - run: pnpm --dir web exec vite build
      - run: cargo tauri android init --ci
        working-directory: shell

      # `init` writes Tauri's template; this lays ecr's own manifest, network
      # security config and launcher icon over it. It has to run after every
      # init, and it warns if the template moved underneath the overlay.
      - run: ./scripts/android-overlay.sh

      # Signed if the keystore secrets are present, unsigned otherwise. An
      # unsigned APK sideloads fine but cannot be upgraded in place by a later
      # signed build. This runs after `android init` because that regenerates
      # gen/android and would discard the file. See docs/content/releasing.md#android.
      - name: Decode the keystore
        id: keystore
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ecr.jks"
          {
            echo "storeFile=$RUNNER_TEMP/ecr.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > shell/gen/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Note the signing state
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            echo "APK will be signed."
          else
            echo "::warning::ANDROID_KEYSTORE is not set — the APK will be unsigned."
          fi

      # The APK is what anyone sideloads; the AAB is the only format Play
      # accepts, and it costs one flag to keep the option open.
      - run: cargo tauri android build --apk --aab
        working-directory: shell

      - name: Collect the APK and the AAB
        run: |
          mkdir -p out
          find shell/gen/android \( -name '*.apk' -o -name '*.aab' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/*.apk
            out/*.aab

  publish:
    name: draft release
    needs: [tarball, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract the changelog section for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version." > notes.md
          fi
          cat notes.md

      # Left as a draft on purpose: CI proves the build succeeded, not that the
      # artifacts run. Download one per platform before publishing.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: artifacts/*
          fail_on_unmatched_files: true

  # Moves the `release` branch to this tag, which is what makes
  # `github:lokeshmohanty/ecr/release` mean "the newest release" to Nix. A flake
  # input cannot follow "the latest tag" — it takes a branch or a fixed ref — so
  # without a branch tracking the tags, every consumer of the stable channel
  # would have to edit their configuration on every release.
  #
  # It runs after the artifacts are built, not before: a tag whose build fails
  # must not become what everyone's `nix flake update` pulls. It does *not* wait
  # for the draft release to be published, because the flake is consumed from
  # git rather than from an artifact, and the tag is already immutable.
  release-branch:
    name: release branch
    needs: [tarball, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A fast-forward, not a force push: releases only ever move forward, so a
      # push that would rewrite history means something is wrong with the tag
      # and failing loudly is the right answer.
      - name: Fast-forward `release` to ${{ github.ref_name }}
        run: |
          git push origin "${GITHUB_REF_NAME}^{commit}:refs/heads/release"

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev

      # In dependency order — each crate's path dependencies carry explicit
      # versions that must already exist on the registry.
      #
      # A version already on the registry is skipped rather than published. A
      # release is several jobs and only some of them can be retried: this one
      # published all four crates on the run whose AppImage bundling then
      # failed, and an upload is permanent, so without the check re-running that
      # tag could only ever fail here on `crate version already uploaded`. The
      # skip is what makes the whole workflow re-runnable against one tag.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            exit 0
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for crate in ecr-core ecr-store ecr-server ecr-cli; do
            echo "== $crate $version =="
            # crates.io rejects a request without a User-Agent, so omitting it
            # would make every crate look unpublished and every publish fail.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: ecr-release (github.com/lokeshmohanty/ecr)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$code" in
              200)
                echo "already on crates.io; skipping"
                continue
                ;;
              404) ;;
              *)
                echo "::error::crates.io answered $code for $crate $version"
                exit 1
                ;;
            esac
            cargo publish -p "$crate" --no-verify
            # The registry index needs a moment before the next crate can see it.
            sleep 30
          done
