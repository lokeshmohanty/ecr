[package]
name = "ecr-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Mail storage for ecr: notmuch queries, MIME parsing and sanitization, sync and send"

# The integration tests build a throwaway notmuch database from fixtures/ at
# the repository root, which a published .crate cannot carry. Shipping them
# would mean shipping a test suite that fails on the first path lookup, so the
# crate carries the library and the repository carries the tests.
exclude = ["tests/"]

[dependencies]
ecr-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
mail-parser = "0.11"
ammonia = "4"
chrono = { workspace = true }
# The mail index. `bundled` compiles SQLite into the binary: FTS5 is then
# guaranteed present, and the tarball, the .deb and the AppImage carry no
# libsqlite3 dependency for a user to satisfy.
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
notify = "8.2.0"
mail-builder = "0.4.4"
base64 = "0.22"
# OAuth: the token endpoints, PKCE, and the random material the flows need.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "charset",
    "form",
    "json",
] }
sha2 = "0.11.0"
rand = "0.10.2"

[dev-dependencies]
tempfile = "3"
